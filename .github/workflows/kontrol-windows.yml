name: Build Kontrol PC (Windows)
on:
  workflow_dispatch:
  push:
    paths: ['windows-control/**']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pasang kebutuhan
        run: pip install -r windows-control/requirements.txt pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --noconsole --name KontrolPC-Windows windows-control/control_app.py

      - uses: actions/upload-artifact@v4
        with:
          name: KontrolPC-Windows
          path: dist/KontrolPC-Windows.exe

      - name: Terbitkan rilis (tautan unduh tetap)
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          tag: kontrol-pc-latest
          name: Kontrol PC (Windows)
          artifacts: dist/KontrolPC-Windows.exe
          token: ${{ secrets.GITHUB_TOKEN }}
          
