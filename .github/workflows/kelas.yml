name: Build Kelas APK
on:
  workflow_dispatch:
  push:
    paths: ['KelasLive-Android.zip']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q KelasLive-Android.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug --no-daemon
        working-directory: KelasLive
      - uses: actions/upload-artifact@v4
        with: { name: KelasLive-apk, path: KelasLive/app/build/outputs/apk/debug/app-debug.apk }
