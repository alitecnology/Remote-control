name: Build Kelas APK
on:
  workflow_dispatch:
  push:
    paths: ['KelasLive-Android.zip']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak zip
        run: |
          unzip -q KelasLive-Android.zip -d proyek
          echo "Isi zip:"
          find proyek -maxdepth 3 | head -n 40

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }

      - name: Build APK
        run: |
          FILE=$(find proyek -maxdepth 3 -name 'settings.gradle*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "settings.gradle tidak ditemukan di dalam zip"
            exit 1
          fi
          cd "$(dirname "$FILE")"
          echo "Proyek ada di: $(pwd)"
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: KelasLive-apk
          path: proyek/**/build/outputs/apk/debug/*.apk
